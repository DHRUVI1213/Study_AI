name: ai_study_assistant
description: AI-powered study assistant with Flutter, Supabase, and Gemini AI.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.9.0
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  provider: ^6.1.2
  file_picker: ^8.3.7
  intl: ^0.20.2
  uuid: ^4.5.1
  flutter_markdown: ^0.7.6+2
  shimmer: ^3.0.0
  shared_preferences: ^2.5.5
  syncfusion_flutter_pdf: ^33.2.13
  archive: ^4.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
